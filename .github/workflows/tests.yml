name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and CloudFerro dependencies
        run: python -m pip install -e '.[test,cloud]'
      - name: Run tests
        run: python -m pytest -q
